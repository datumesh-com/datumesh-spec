name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tests/test_migration_0_3_0.py reads the spec-0.2.1 files from git
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pynacl==1.5.0 jsonschema==4.23.0
      - run: python tools/canon.py check
      - run: python -m unittest -v
        working-directory: tests
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund && node oracle.mjs
        working-directory: tests/oracle
